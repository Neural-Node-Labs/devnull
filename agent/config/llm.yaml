# devnull/agent/config/llm.yaml
# LLM backend configuration for the devnull agent.
# Swappable provider — this sets DeepSeek as the active backend.
#
# NOTE: deepseek-chat / deepseek-reasoner are deprecated 2026-07-24 15:59 UTC and will
# return errors after that with no fallback. Using the current model IDs directly:
#   deepseek-v4-flash = non-thinking mode (fast, cheap, default)
#   deepseek-v4-pro   = thinking mode (deeper reasoning, higher cost)
#
# IMPORTANT (per DeepSeek's own Thinking Mode docs): temperature/top_p/presence_penalty/
# frequency_penalty have NO EFFECT in thinking mode -- devnull's DeepSeekClient omits them
# from the request entirely when thinking is enabled, rather than sending dead parameters.
# reasoning_effort ("high"/"max") is the real lever for thinking-mode depth instead.

provider: deepseek
base_url: https://api.deepseek.com/v1
endpoint: /chat/completions
# BUG FIX: this was previously "deepseek-v4-pro" with the comment "non-thinking mode" attached
# to it -- v4-pro is the THINKING-mode model per the header comment above, so every skill
# without an entry in `overrides` below (analyst, devops, docker-expert, kubernetes-expert,
# performance-tester, playwright-ui-tester, programmer, secops, tester, conversation, and any
# others without an override) was silently resolving to the expensive Pro+thinking tier for
# every single call -- including a plain "hello" -- via resolveModelForSkill()'s
# `override?.model ?? config.model` fallback. That also made the rca/architect/pentester
# overrides below functionally inert, since they already matched what everything else was
# getting by default. Fixed to the fast/cheap model, matching what the comments already said
# the intent was.
model: deepseek-v4-flash    # fast/cheap default; rca/architect/pentester override to v4-pro below
api_key_env: DEEPSEEK_API_KEY
max_tokens: 4096
temperature: 0.0            # DeepSeek's own published guidance: 0.0 for code/math tasks (this is a coding agent)
thinking: false              # always sent explicitly (enabled/disabled), never omitted -- see the
                             # same bug-fix note above: this was `true` by default, same issue

# Per-skill overrides: some skills benefit from thinking mode + higher reasoning effort even
# if the default stays fast. reasoning_effort only takes effect when thinking is true.
overrides:
  rca:
    model: deepseek-v4-pro
    thinking: true
    reasoning_effort: high
  architect:
    model: deepseek-v4-pro
    thinking: true
    reasoning_effort: high
  pentester:
    model: deepseek-v4-pro
    thinking: true
    reasoning_effort: max    # security-critical reasoning gets the deepest effort level

# Fallback provider if DEEPSEEK_API_KEY is unset or the API errors out.
fallback:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
