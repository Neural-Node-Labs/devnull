services:
  # ─── API Service ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devnull-api:latest
    container_name: devnull-api
    env_file:
      - .env
    environment:
      - DEVNULL_HOME=/opt/devnull
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}
      - DEVNULL_API_PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3001:3001"
    volumes:
      # Mount your project as the workspace devnull operates on.
      - .:/workspace
    working_dir: /workspace
    restart: unless-stopped

    # ------------------------------------------------------------------
    # Resource limits — prevent the container from starving the host.
    # ------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

    # ------------------------------------------------------------------
    # Healthcheck
    # ------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', r => {process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ------------------------------------------------------------------
    # Profiles:
    #   serve     — API + UI server mode (docker compose --profile serve up -d)
    #
    # For interactive CLI mode, use:
    #   docker compose run --rm api --task "fix the bug"
    #   docker compose run --rm api --chat
    # ------------------------------------------------------------------
    profiles:
      - serve

    # Start the API server (serve profile)
    command:
      - "--serve"
      - "--port"
      - "3001"
      - "--host"
      - "0.0.0.0"

  # ─── UI Service ──────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: devnull-ui:latest
    container_name: devnull-ui
    ports:
      - "8080:80"
    environment:
      - API_HOST=api
      - API_PORT=3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

    # ------------------------------------------------------------------
    # Resource limits
    # ------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"

    # ------------------------------------------------------------------
    # Healthcheck
    # ------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # ------------------------------------------------------------------
    # Profiles:
    #   serve     — starts the UI alongside the API
    # ------------------------------------------------------------------
    profiles:
      - serve
