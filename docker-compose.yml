# devnull — Docker Compose
# Spins up the API backend and the UI frontend (served via nginx).
#
# Usage:
#   docker compose up -d --build
#   docker compose down
#   docker compose logs -f

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devnull-api:latest
    container_name: devnull-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DEVNULL_API_PORT=3001
      - DEVNULL_API_HOST=0.0.0.0
      - DATABASE_TYPE=sqlite
      - DATABASE_SQLITE_PATH=/data/devnull.db
    volumes:
      - devnull-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: devnull-ui:latest
    container_name: devnull-ui
    ports:
      - "80:80"
    environment:
      - API_HOST=api
      - API_PORT=3001
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  devnull-data:
    driver: local
