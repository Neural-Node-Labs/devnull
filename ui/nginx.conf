server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ─── Long timeout for LLM task execution ─────────────────────────
        # The /api/v1/chat, /api/v1/chat/plan, and /api/v1/chat/execute endpoints
        # run the full ReAct loop (multiple LLM calls + tool executions) which can
        # take several minutes. Nginx defaults to 60s for proxy_read_timeout, which
        # causes a 504 Gateway Time-out when a task runs longer than that.
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;   # 10 minutes — LLM tasks can be slow
        proxy_send_timeout 60s;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

